services:
  - type: web
    name: blob-arena-server
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_ROOMS
        value: '30'
      - key: MAX_CLIENTS
        value: '100'
